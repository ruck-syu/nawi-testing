# Railway service config for NAWI Testing (API + UI, single service).
#
# Deploy: New Project → Deploy from GitHub Repo → point at this repo.
# Railway auto-detects Node 22 from package.json engines. Then set variables:
#   DATABASE_URL   Supabase pooler URL (port 6543, transaction mode)
#   JWT_SECRET     any long random string (else sessions reset on every restart)
# No CLIENT_ORIGIN / VITE_API_BASE needed: the server serves the built UI itself,
# so UI and API share one origin. No browser binary is installed; PDF requests
# fall back to print-styled HTML with browser Save-as-PDF instructions
# (the app says so when it happens).

[build]
builder = "NIXPACKS"
# npm install (not ci): ci deletes node_modules outright and fails with
# EBUSY on the layer-cached .cache dir. Versions still follow the lockfile.
buildCommand = "npm install && cd web && npx vite build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
