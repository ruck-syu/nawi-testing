# Render Blueprint for the OIML R76 report system.
#
# Deploy: dashboard.render.com → New → Blueprint → point at this repo.
# Set DATABASE_URL (Supabase Postgres) when prompted — the only secret.
#
# NOTE on files: uploads (photos, signatures) and generated reports live on local
# disk (server/uploads, server/reports). The free instance filesystem is ephemeral,
# so those files disappear on restart/redeploy while their database rows remain.
# Attach a persistent disk (paid instance) or move storage to Supabase Storage
# before treating this as production.

services:
  - type: web
    name: sih-r76-report
    runtime: node
    plan: free
    buildCommand: npm ci && cd web && npx vite build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
